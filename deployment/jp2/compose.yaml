name: ai-project

x-app: &app
  image: ai-project-backend:local
  env_file:
    - /etc/ai-project/ai-project.env
  volumes:
    - /srv/ai-project/storage:/app/storage
  network_mode: host
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  backend:
    <<: *app
    container_name: ai-project-backend
    build:
      context: ../..
      dockerfile: deployment/jp2/Dockerfile
      target: backend
    command: ["waitress-serve", "--listen=127.0.0.1:5000", "run:app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-review-runner:
    <<: *app
    container_name: ai-project-ai-review
    command: ["python", "scripts/run-grammar-ai-review.py", "--interval", "5"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    image: ai-project-web:local
    container_name: ai-project-web
    build:
      context: ../..
      dockerfile: deployment/jp2/Dockerfile
      target: web
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=16m
      - /config:size=16m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

